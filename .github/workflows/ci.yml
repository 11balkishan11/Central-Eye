name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ns3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff (Linting)
      run: ruff check .

    - name: Run MyPy (Type Checking)
      run: mypy --explicit-package-bases app

    - name: Run Security Scans (Bandit & Pip-Audit)
      run: |
        bandit -r app/
        pip-audit

    - name: Run Pytest with Coverage
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/ns3_test
      run: |
        pytest --cov=app tests/ --cov-fail-under=80

    - name: Check Alembic Migrations
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/ns3_test
      run: |
        alembic upgrade head

    - name: OpenAPI Schema Generation Check
      run: |
        python -c "import json; from app.main import app; json.dumps(app.openapi())"

    - name: Docker Build Validation
      run: |
        docker build -t ns3-backend:test .
