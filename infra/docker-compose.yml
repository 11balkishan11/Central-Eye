services:
  db:
    image: postgres:17
    container_name: ns3_postgres
    environment:
      POSTGRES_USER: ns3admin
      POSTGRES_PASSWORD: ns3password
      POSTGRES_DB: ns3central
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ns3admin -d ns3central"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ns3_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
